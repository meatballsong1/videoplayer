<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Video Router Player</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
            padding: 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        input {
            width: 75%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        video, iframe {
            width: 100%;
            margin-top: 20px;
            height: 500px;
            background: black;
            border: none;
        }
    </style>
</head>
<body>

<h2>Smart Video Router Player</h2>

<input id="videoUrl" placeholder="Paste MP4 / MEGA / anon embed link">
<button onclick="loadVideo()">Play</button>

<!-- MP4 PLAYER -->
<video id="videoPlayer" controls autoplay muted playsinline style="display:none;"></video>

<!-- IFRAME PLAYER -->
<iframe id="iframePlayer" allowfullscreen allow="autoplay" style="display:none;"></iframe>

<script>
const input = document.getElementById("videoUrl");
const videoPlayer = document.getElementById("videoPlayer");
const iframePlayer = document.getElementById("iframePlayer");

function resetPlayers() {
    videoPlayer.pause();
    videoPlayer.removeAttribute("src");
    videoPlayer.style.display = "none";

    iframePlayer.src = "";
    iframePlayer.style.display = "none";
}

// Detect MEGA
function isMega(url) {
    return url.includes("mega.nz");
}

// Detect anon embed
function isAnonEmbed(url) {
    return url.includes("anonmp4.help/embed");
}

// Detect direct MP4
function isMp4(url) {
    return url.split("?")[0].toLowerCase().endsWith(".mp4");
}

function loadVideo() {
    const url = input.value.trim();
    if (!url) return;

    resetPlayers();

    console.log("Loading URL:", url);

    // 1. ANON EMBED (iframe)
    if (isAnonEmbed(url)) {
        iframePlayer.src = url;
        iframePlayer.style.display = "block";
        return;
    }

    // 2. MEGA (iframe)
    if (isMega(url)) {
        iframePlayer.src = url.replace("/file/", "/embed/");
        iframePlayer.style.display = "block";
        return;
    }

    // 3. MP4 (video tag)
    if (isMp4(url)) {
        videoPlayer.style.display = "block";
        videoPlayer.src = url;
        videoPlayer.muted = true;
        videoPlayer.load();

        videoPlayer.play().catch(err => {
            console.log("Autoplay blocked:", err);
        });

        return;
    }

    alert("Unsupported link type");
}

// Auto-load from ?video=
const params = new URLSearchParams(window.location.search);
const autoVideo = params.get("video");

if (autoVideo) {
    window.addEventListener("load", () => {
        input.value = autoVideo;
        loadVideo();
    });
}
</script>

</body>
</html>
