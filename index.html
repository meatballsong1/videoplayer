<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Video Player</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 75%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        video {
            width: 100%;
            margin-top: 20px;
            background: black;
        }
    </style>
</head>
<body>

    <h2>MP4 Player</h2>

    <input type="text" id="videoUrl" placeholder="Paste MP4 link here">
    <button onclick="loadVideo()">Play</button>

    <video id="player" controls autoplay muted playsinline preload="auto"></video>

    <script>
        const player = document.getElementById("player");
        const input = document.getElementById("videoUrl");

        function loadVideo() {
            const url = input.value.trim();
            if (!url) return;

            // Stop previous video cleanly
            player.pause();
            player.removeAttribute("src");
            player.load();

            // Set new source
            player.src = url;
            player.muted = true; // required for autoplay
            player.load();

            player.play().catch(err => {
                console.log("Autoplay blocked:", err);
            });
        }

        // Auto-load from URL parameter: ?video=
        const params = new URLSearchParams(window.location.search);
        const autoVideo = params.get("video");

        if (autoVideo) {
            window.addEventListener("load", () => {
                input.value = autoVideo;
                loadVideo();
            });
        }

        // Optional: first click unlocks unmuted playback
        document.addEventListener("click", () => {
            player.muted = false;
        }, { once: true });
    </script>

</body>
</html>
